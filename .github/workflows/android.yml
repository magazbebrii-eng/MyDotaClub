
name: Build Dota Arena APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DotaArenaAndroid.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902

      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q DotaArenaAndroid.zip -d project

      - name: Find Gradle project
        run: |
          find project -name settings.gradle -o -name settings.gradle.kts
          find project -name gradlew

      - name: Build APK
        run: gradle assembleDebug
        working-directory: project

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DotaArena-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
